name: gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # diff-based changelog and VERSION gates need history
      - name: Run the complete repository gate
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          case "$base" in ""|0000000000000000000000000000000000000000) base=HEAD~1 ;; esac
          sh scripts/check-repo.sh "$base"
