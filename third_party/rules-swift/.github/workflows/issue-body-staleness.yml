name: issue-body-staleness
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  issue-body-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit open issue bodies
        run: sh scripts/check-issue-body-staleness.sh
