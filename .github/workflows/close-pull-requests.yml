# The public GitHub repository is a read-only mirror: every sync rewrites it
# from the canonical source, so a pull request merged there would be lost on
# the next sync. GitHub has no setting that disables pull requests, so this
# closes each one with a note pointing to Issues. It runs only on the public
# mirror; pull_request_target keeps the base repository's token and never
# checks out the pull request's code.
name: close-pull-requests
on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close:
    if: github.repository == 'diyamantina/AppUIKit'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close with a pointer to Issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Thanks for the interest. This repository is a read-only mirror of the canonical source, so pull requests cannot be merged here and are closed automatically. Please open an issue describing the change instead; it will be picked up from there."
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
