name: rules-swift gate

# Runs the codified rules-swift gates on every pull request. The corpus-pin
# integrity check must stay green (it fails if the vendored canon drifts from its
# pinned commit). The full strict gate is required: the repo reached conformance
# (docs/rules-swift-audit.md carries no blocker rows), so a regression must fail
# the lane, not merely report.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Corpus pin integrity (required)
        run: sh scripts/check-rules-corpus-coverage.sh

      - name: Install hooks (the rules gate verifies core.hooksPath)
        run: sh scripts/install-hooks.sh

      - name: Full rules gate (required)
        run: sh scripts/check-rules-swift.sh
