# Runs on the private relay repo (Mihaela/appuikit-mirror-relay on Codeberg),
# which receives this repo's full history via a Gitea push-mirror. Strips
# CLAUDE.md and AGENTS.md from every commit and force-pushes the result to
# the public github.com/diyamantina/AppUIKit mirror. Fully server-side: no
# dependency on any local machine being on.
name: mirror-to-github
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: pip install --quiet git-filter-repo

      - name: Strip internal-only files from history
        run: |
          git filter-repo --force --invert-paths \
            --path CLAUDE.md \
            --path AGENTS.md

      - name: Push filtered history to GitHub mirror
        run: |
          git remote add public "https://diyamantina:${GH_MIRROR_TOKEN}@github.com/diyamantina/AppUIKit.git"
          git push --force public main
          git push --force public --tags
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
