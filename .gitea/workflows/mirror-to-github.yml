# Publishes a filtered copy of this repo to github.com/diyamantina/AppUIKit
# for Swift Package Index visibility. CLAUDE.md and AGENTS.md stay tracked
# normally here; this job strips them only from the copy that reaches
# GitHub, never from this repo's own history.
name: mirror-to-github
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: pip3 install --quiet git-filter-repo

      - name: Build filtered copy
        run: |
          git filter-repo --force --invert-paths \
            --path CLAUDE.md \
            --path AGENTS.md

      - name: Push filtered copy to GitHub mirror
        run: |
          git remote add public "https://diyamantina:${GH_MIRROR_TOKEN}@github.com/diyamantina/AppUIKit.git"
          git push --force public main
          git push --force public --tags
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
